
name: invoice_easy
description: InvoiceEasy - cross-business invoicing for small businesses, freelancers and professionals.
publish_to: 'none'
version: 3.0.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  uuid: ^4.5.1
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  supabase_flutter: ^2.15.4
  file_picker: ^8.1.7
  connectivity_plus: ^6.1.5
  http: ^1.6.0
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/InvoiceEasy_Mark_Centered.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/InvoiceEasy_Mark_Centered.png"

  web:
    generate: true
    image_path: "assets/images/InvoiceEasy_Mark_Centered.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

